name: Publish SoundPack to Maven Central

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Setup GPG
        shell: bash
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
        run: |
          set -e

          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"

          echo "Decoding GPG private key..."

          printf '%s' "$SIGNING_KEY_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/signing-key.asc"

          echo "Importing GPG private key..."

          gpg --batch \
            --import \
            "$RUNNER_TEMP/signing-key.asc"

          echo "Checking imported key..."

          gpg --batch \
            --list-secret-keys \
            --keyid-format LONG

          echo "Testing GPG signing..."

          printf 'SoundPack signing test\n' \
            > "$RUNNER_TEMP/signing-test.txt"

          gpg \
            --batch \
            --yes \
            --pinentry-mode loopback \
            --passphrase "$SIGNING_PASSWORD" \
            --local-user "$SIGNING_KEY_ID" \
            --detach-sign \
            "$RUNNER_TEMP/signing-test.txt"

          echo "GPG signing test: OK"

      - name: Publish to Maven Central
        shell: bash
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          GNUPGHOME: ${{ runner.temp }}/gnupg
        run: |
          set -e

          echo "Starting Maven Central publication..."

          ./gradlew :soundpack:publishToMavenCentral \
            -PmavenCentralUsername="$CENTRAL_USERNAME" \
            -PmavenCentralPassword="$CENTRAL_TOKEN" \
            -Psigning.gnupg.keyName="$SIGNING_KEY_ID" \
            -Psigning.gnupg.passphrase="$SIGNING_PASSWORD" \
            -Psigning.gnupg.homeDir="$GNUPGHOME"