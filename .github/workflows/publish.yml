name: Publish SoundPack to Maven Central

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Validate signing key
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          set -e

          printf '%s' "$SIGNING_KEY" > /tmp/signing-key.asc

          echo "Key file size:"
          wc -c /tmp/signing-key.asc

          echo "First line:"
          head -n 1 /tmp/signing-key.asc

          echo "Last line:"
          tail -n 1 /tmp/signing-key.asc

          echo "Validating PGP structure..."

          gpg --batch --show-keys /tmp/signing-key.asc

          echo "PGP key validation: OK"

          rm -f /tmp/signing-key.asc

      - name: Publish to Maven Central
        run: ./gradlew :soundpack:publishToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_TOKEN }}

          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}