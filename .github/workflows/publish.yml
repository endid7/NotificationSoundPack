name: Publish SoundPack to Maven Central

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Prepare GPG signing key
        shell: bash
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          set -e

          echo "Decoding signing key..."

          printf '%s' "$SIGNING_KEY_BASE64" \
            | base64 --decode \
            > /tmp/signing-key.asc

          echo "Converting ASCII key to GPG keyring..."

          gpg --batch \
            --dearmor \
            --yes \
            --output /tmp/signing-key.gpg \
            /tmp/signing-key.asc

          echo "Checking GPG keyring..."

          ls -lh /tmp/signing-key.gpg

          echo "Checking for secret key..."

          gpg --batch \
            --list-packets \
            /tmp/signing-key.gpg \
            | grep -m 1 -E "secret key|secret sub key"

          echo "Signing key preparation: OK"

      - name: Publish to Maven Central
        shell: bash
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -e

          ./gradlew :soundpack:publishToMavenCentral \
            -PmavenCentralUsername="$CENTRAL_USERNAME" \
            -PmavenCentralPassword="$CENTRAL_TOKEN" \
            -Psigning.keyId="$SIGNING_KEY_ID" \
            -Psigning.password="$SIGNING_PASSWORD" \
            -Psigning.secretKeyRingFile="/tmp/signing-key.gpg"