name: Publish SoundPack to Maven Central

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Prepare signing key
        shell: bash
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          set -e

          printf '%s' "$SIGNING_KEY_BASE64" \
            | base64 --decode \
            > /tmp/signing-key.asc

          echo "Signing key size:"
          wc -c /tmp/signing-key.asc

          echo "First line:"
          head -n 1 /tmp/signing-key.asc

          echo "Last line:"
          tail -n 1 /tmp/signing-key.asc

          echo "Validating signing key..."

          gpg --batch --show-keys /tmp/signing-key.asc

          echo "Signing key validation: OK"

      - name: Publish to Maven Central
        shell: bash
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -e

          echo "Preparing PGP signing key..."

          SIGNING_KEY="$(printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode)"

          export ORG_GRADLE_PROJECT_mavenCentralUsername="$CENTRAL_USERNAME"
          export ORG_GRADLE_PROJECT_mavenCentralPassword="$CENTRAL_TOKEN"

          export ORG_GRADLE_PROJECT_signingInMemoryKey="$SIGNING_KEY"
          export ORG_GRADLE_PROJECT_signingInMemoryKeyId="$SIGNING_KEY_ID"
          export ORG_GRADLE_PROJECT_signingInMemoryKeyPassword="$SIGNING_PASSWORD"

          echo "Starting Maven Central publication..."

          ./gradlew :soundpack:publishToMavenCentral